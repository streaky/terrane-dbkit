documentation:
  status: complete
  title: Drivers
  title-style: text
  summary: Runtime driver selection, current availability, and backend-specific behavior.
  tags: [database, drivers]
  blocks:
    - type: markdown
      markdown: |-
        Applications select a driver through `config` and `connect`, while using
        the common `/streaky/dbkit` connection, statement, value, and result types.
        Driver-neutral access does not make SQL dialects or database configuration
        interchangeable. See [[dbkit.api.database]] for the shared API contract.

        | Driver | Configuration name | Current support | Driver reference |
        | --- | --- | --- | --- |
        | SQLite | `sqlite` | Implemented; local databases only | [[dbkit.drivers.sqlite]] |
        | PostgreSQL | `postgres` | Implemented; concrete SQLx PostgreSQL | [[dbkit.drivers.postgresql]] |
        | MySQL | `mysql` | Reserved name; unavailable | [[dbkit.drivers.mysql]] |

        `available-drivers` returns `sqlite` and `postgres`. Selecting `mysql`
        raises `driver-unavailable`; other unrecognized names raise
        `unknown-driver`. There is no fallback to another backend.
  sections:
    - id: choosing-a-driver
      title: Choosing a driver
      blocks:
        - type: markdown
          markdown: |-
            SQLite remains the default when constructing `config` and interprets
            `database` as a local filename. PostgreSQL interprets it as a SQLx
            PostgreSQL URL. Consult [[dbkit.drivers.sqlite]] or
            [[dbkit.drivers.postgresql]] for native SQL, value mappings,
            connection defaults and transaction behavior.

            MySQL remains unavailable; its page records that boundary rather
            than inventing a connection or SQL-portability contract.
  see-also:
    - dbkit.api.database
    - dbkit.drivers.sqlite
    - dbkit.drivers.postgresql
    - dbkit.drivers.mysql
