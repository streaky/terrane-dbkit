  title: MySQL
  title-style: text
  summary: The reserved MySQL driver name and its current unavailability.
  tags: [database, drivers, mysql]
  blocks:
    - type: markdown
      markdown: |-
        MySQL is not implemented in the current dbkit release. The reserved
        configuration name is `mysql`. Selecting it raises `driver-unavailable`
        before a connection is opened; it is not included in `available-drivers`
        and does not fall back to SQLite.

        No MySQL DSN, credentials, transport, TLS, pooling, value mapping, or
        placeholder-translation contract is exposed. This page records current
        availability, not a simulated driver or a committed implementation plan.
        Do not infer MySQL behavior from another driver's settings or SQL scanner.
        See [[dbkit.drivers]] for the support matrix and the SQLite/PostgreSQL
        reference pages for the implemented backends.
