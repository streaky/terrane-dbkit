documentation:
  status: complete
  title: dbkit
  title-style: text
  summary: Optional Terrane-native relational database access through SQLite and PostgreSQL.
  tags: [database, sqlite, postgresql, getting-started]
  blocks:
    - type: markdown
      markdown: |-
        `streaky/dbkit` exposes a driver-neutral connection API with SQLite and
        PostgreSQL drivers. It is not Terrane's canonical database layer. Add a
        local path dependency and grant `build`, `filesystem`, `threads` and
        `networking` capabilities; use the current compiler and threaded executor.

        SQLx 0.9 supplies the concrete runtimes. Native connections remain
        private, and the package defines no database-shaped Rust facade. See
        [[dbkit.api.database]] for the shared API and narrow native boundaries.
        Backend-specific configuration, SQL, values and limitations live under
        [[dbkit.drivers.sqlite]] and [[dbkit.drivers.postgresql]].
    - type: example
      id: dbkit-dependency
      title: Local package dependency
      language: toml
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        package = "notes"
        executor = "threaded"
        rust-toolchain = "pinned"

        [namespaces]
        app = "src"

        [profile]
        name = "notes"
        capabilities = ["build", "filesystem", "threads", "networking"]

        [terrane-dependencies.streaky.dbkit]
        path = "../dbkit"
      response: null
      diagnostic: null
      markdown: null
