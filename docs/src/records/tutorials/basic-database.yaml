documentation:
  status: complete
  title: Store and read a note
  title-style: text
  summary: Connect to an in-memory SQLite database, bind values, query, and use transactions.
  tags: [database, tutorial, sqlite]
  blocks:
    - type: markdown
      markdown: |-
        This complete application assumes the `streaky/dbkit` local path
        dependency and profile from [[dbkit.guide.introduction]]. Save it as
        `src/main.trn` in a package with the `app` namespace. It creates a table,
        inserts and reads a note, then rolls back a delete to demonstrate that the
        note remains. The `connection` reference is passed to a helper unchanged.
    - type: example
      id: complete-basic-application
      title: Complete application
      language: terrane
      mode: illustrative
      target: null
      timeout-ms: null
      source: |-
        namespace app

        from /streaky/dbkit import config, connect, connection, integer-value, text-value

        async function read-note string; database shared ref connection
            selected = await database.prepare; 'SELECT body FROM notes WHERE id = :id'
            selected.bind; 'id', (integer-value; 1)
            results = await selected.query;
            record = results.fetch;
            if record != none
                return (record.named; 'body').as-text;
            return ''

        async function main;
            database = await connect; (instance config; 'sqlite', ':memory:')
            await database.execute; 'CREATE TABLE notes (id INTEGER PRIMARY KEY, body TEXT NOT NULL)'
            await database.begin;
            inserted = await database.prepare; 'INSERT INTO notes (id, body) VALUES (:id, :body)'
            inserted.bind; 'id', (integer-value; 1)
            inserted.bind; 'body', (text-value; 'hello dbkit')
            changed = await inserted.execute;
            print; changed.affected
            await database.commit;
            print; (await read-note; database)
            await database.begin;
            await database.execute; 'DELETE FROM notes'
            await database.rollback;
            print; (await read-note; database)
            await database.close;
      response: null
      diagnostic: null
      markdown: null
